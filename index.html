<!DOCTYPE html>
<html lang="fr" data-bs-theme="light">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ratayzyk - Hauts</title>

        <link rel="stylesheet" href="bootstrap-5.3.8/css/bootstrap.css">
        <link rel="stylesheet" href="css/custom.css">
        
        <script src="bootstrap-5.3.8/js/bootstrap.js"></script>
        <script src="js/navbar.js"></script>
        <script src="js/modal.js"></script>

        <link rel="icon" type="image/x-icon" href="images/logo.png">
    </head>

    <body class="">
        <div class="container">
            <div class="row mt-4 m-1 p-2">
                <h1>Hauts</h1>
            </div>

            <div id="poulet">
            </div>

        </div>

        <!-- modal -->         
        <div class="modal fade" id="leModal" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">

                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="staticBackdropLabel">Photos</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <!-- caroussel du modal -->
                        <div id="carouselModal" class="carousel slide">
                            <div class="carousel-indicators" id="carouselModalIndicators">
                            </div>

                            <div class="carousel-inner" id="carouselModalBody">
                                
                            </div>

                            <button class="carousel-control-prev" type="button" data-bs-target="#carouselModal" data-bs-slide="prev">
                                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Previous</span>
                            </button>

                            <button class="carousel-control-next" type="button" data-bs-target="#carouselModal" data-bs-slide="next">
                                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                                <span class="visually-hidden">Next</span>
                            </button>

                        </div>
                         <!-- fin caroussel modal -->
                    </div>
                    
                </div>
            </div>
        </div>
        <!-- fin modal -->

    </body>

</html>
